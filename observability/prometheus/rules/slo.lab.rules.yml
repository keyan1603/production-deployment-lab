# Generated by scripts/make_slo_rules.py from observability/slo.json. Do not edit by hand.
groups:
- name: slo-recording
  interval: 15s
  rules:
  - record: slo:error_ratio:ticket_availability:1m
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[1m]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[1m])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[1m]))) > 0.02)
  - record: slo:error_ratio:ticket_availability:3m
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[3m]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[3m])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[3m]))) > 0.02)
  - record: slo:error_ratio:ticket_availability:5m
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[5m]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[5m])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[5m]))) > 0.02)
  - record: slo:error_ratio:ticket_availability:15m
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[15m]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[15m])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[15m]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:1m
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[1m]))) / (sum(rate(ai_ticket_outcomes_total[1m]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[1m]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:3m
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[3m]))) / (sum(rate(ai_ticket_outcomes_total[3m]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[3m]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:5m
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[5m]))) / (sum(rate(ai_ticket_outcomes_total[5m]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[5m]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:15m
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[15m]))) / (sum(rate(ai_ticket_outcomes_total[15m]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[15m]))) > 0.02)
  - record: slo:error_ratio:ticket_latency:1m
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[1m]))) / (sum(rate(ai_ticket_duration_seconds_count[1m]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[1m])))
      > 0.02)
  - record: slo:error_ratio:ticket_latency:3m
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[3m]))) / (sum(rate(ai_ticket_duration_seconds_count[3m]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[3m])))
      > 0.02)
  - record: slo:error_ratio:ticket_latency:5m
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[5m]))) / (sum(rate(ai_ticket_duration_seconds_count[5m]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[5m])))
      > 0.02)
  - record: slo:error_ratio:ticket_latency:15m
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[15m]))) / (sum(rate(ai_ticket_duration_seconds_count[15m]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[15m])))
      > 0.02)
  - record: slo:error_ratio:answer_quality_probe:1m
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[1m]))) / (sum(rate(ai_probe_results_total[1m]))))) and on() ((sum(rate(ai_probe_results_total[1m])))
      > 0.005)
  - record: slo:error_ratio:answer_quality_probe:3m
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[3m]))) / (sum(rate(ai_probe_results_total[3m]))))) and on() ((sum(rate(ai_probe_results_total[3m])))
      > 0.005)
  - record: slo:error_ratio:answer_quality_probe:5m
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[5m]))) / (sum(rate(ai_probe_results_total[5m]))))) and on() ((sum(rate(ai_probe_results_total[5m])))
      > 0.005)
  - record: slo:error_ratio:answer_quality_probe:15m
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[15m]))) / (sum(rate(ai_probe_results_total[15m]))))) and on() ((sum(rate(ai_probe_results_total[15m])))
      > 0.005)
  - record: slo:error_ratio:no_degraded_tier:1m
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[1m]))) / (sum(rate(ai_gateway_requests_total[1m]))))) and on() ((sum(rate(ai_gateway_requests_total[1m])))
      > 0.02)
  - record: slo:error_ratio:no_degraded_tier:3m
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[3m]))) / (sum(rate(ai_gateway_requests_total[3m]))))) and on() ((sum(rate(ai_gateway_requests_total[3m])))
      > 0.02)
  - record: slo:error_ratio:no_degraded_tier:5m
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[5m]))) / (sum(rate(ai_gateway_requests_total[5m]))))) and on() ((sum(rate(ai_gateway_requests_total[5m])))
      > 0.02)
  - record: slo:error_ratio:no_degraded_tier:15m
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[15m]))) / (sum(rate(ai_gateway_requests_total[15m]))))) and on() ((sum(rate(ai_gateway_requests_total[15m])))
      > 0.02)
- name: slo-alerts
  interval: 15s
  rules:
  - alert: SLOBurn_ticket_availability_page
    expr: (slo:error_ratio:ticket_availability:5m / 0.01 > 14.4) and (slo:error_ratio:ticket_availability:1m / 0.01 > 14.4)
    for: 30s
    labels:
      severity: page
      slo: ticket_availability
    annotations:
      summary: ticket_availability is burning its error budget 14.4x too fast (5m and 1m)
      description: The ticket API answers without a server error. Objective 99.0%.
  - alert: SLOBurn_ticket_availability_ticket
    expr: (slo:error_ratio:ticket_availability:15m / 0.01 > 6) and (slo:error_ratio:ticket_availability:3m / 0.01 > 6)
    for: 1m
    labels:
      severity: ticket
      slo: ticket_availability
    annotations:
      summary: ticket_availability is burning its error budget 6x too fast (15m and 3m)
      description: The ticket API answers without a server error. Objective 99.0%.
  - alert: SLOBurn_ticket_safe_completion_page
    expr: (slo:error_ratio:ticket_safe_completion:5m / 0.1 > 14.4) and (slo:error_ratio:ticket_safe_completion:1m / 0.1 > 14.4)
    for: 30s
    labels:
      severity: page
      slo: ticket_safe_completion
    annotations:
      summary: ticket_safe_completion is burning its error budget 14.4x too fast (5m and 1m)
      description: A ticket is released or escalated on purpose, not held for a person and not lost to an error. Objective 90.0%.
  - alert: SLOBurn_ticket_safe_completion_ticket
    expr: (slo:error_ratio:ticket_safe_completion:15m / 0.1 > 6) and (slo:error_ratio:ticket_safe_completion:3m / 0.1 > 6)
    for: 1m
    labels:
      severity: ticket
      slo: ticket_safe_completion
    annotations:
      summary: ticket_safe_completion is burning its error budget 6x too fast (15m and 3m)
      description: A ticket is released or escalated on purpose, not held for a person and not lost to an error. Objective 90.0%.
  - alert: SLOBurn_ticket_latency_page
    expr: (slo:error_ratio:ticket_latency:5m / 0.05 > 14.4) and (slo:error_ratio:ticket_latency:1m / 0.05 > 14.4)
    for: 30s
    labels:
      severity: page
      slo: ticket_latency
    annotations:
      summary: ticket_latency is burning its error budget 14.4x too fast (5m and 1m)
      description: A ticket is finished within 60 seconds. Objective 95.0%.
  - alert: SLOBurn_ticket_latency_ticket
    expr: (slo:error_ratio:ticket_latency:15m / 0.05 > 6) and (slo:error_ratio:ticket_latency:3m / 0.05 > 6)
    for: 1m
    labels:
      severity: ticket
      slo: ticket_latency
    annotations:
      summary: ticket_latency is burning its error budget 6x too fast (15m and 3m)
      description: A ticket is finished within 60 seconds. Objective 95.0%.
  - alert: SLOBurn_answer_quality_probe_page
    expr: (slo:error_ratio:answer_quality_probe:5m / 0.05 > 14.4) and (slo:error_ratio:answer_quality_probe:1m / 0.05 > 14.4)
    for: 30s
    labels:
      severity: page
      slo: answer_quality_probe
    annotations:
      summary: answer_quality_probe is burning its error budget 14.4x too fast (5m and 1m)
      description: Probe questions with known right answers are answered correctly. Objective 95.0%.
  - alert: SLOBurn_answer_quality_probe_ticket
    expr: (slo:error_ratio:answer_quality_probe:15m / 0.05 > 6) and (slo:error_ratio:answer_quality_probe:3m / 0.05 > 6)
    for: 1m
    labels:
      severity: ticket
      slo: answer_quality_probe
    annotations:
      summary: answer_quality_probe is burning its error budget 6x too fast (15m and 3m)
      description: Probe questions with known right answers are answered correctly. Objective 95.0%.
  - alert: SLOBurn_no_degraded_tier_page
    expr: (slo:error_ratio:no_degraded_tier:5m / 0.01 > 14.4) and (slo:error_ratio:no_degraded_tier:1m / 0.01 > 14.4)
    for: 30s
    labels:
      severity: page
      slo: no_degraded_tier
    annotations:
      summary: no_degraded_tier is burning its error budget 14.4x too fast (5m and 1m)
      description: Model calls are answered by a normal-tier model, not the degraded fallback. Objective 99.0%.
  - alert: SLOBurn_no_degraded_tier_ticket
    expr: (slo:error_ratio:no_degraded_tier:15m / 0.01 > 6) and (slo:error_ratio:no_degraded_tier:3m / 0.01 > 6)
    for: 1m
    labels:
      severity: ticket
      slo: no_degraded_tier
    annotations:
      summary: no_degraded_tier is burning its error budget 6x too fast (15m and 3m)
      description: Model calls are answered by a normal-tier model, not the degraded fallback. Objective 99.0%.
  - alert: RestrictedFactLeaked
    expr: increase(ai_probe_leaks_total[15m]) > 0
    for: 0s
    labels:
      severity: page
      slo: access_control
    annotations:
      summary: A synthetic probe found a restricted fact in an answer
      description: Access control failed for at least one probe in the last 15 minutes. The objective is zero.
  - alert: DriftCritical
    expr: ai_drift_verdict == 2
    for: 1m
    labels:
      severity: page
      slo: drift
    annotations:
      summary: The drift monitor reads critical against the saved baseline
      description: See the monitor's /state for the findings (quality, leaks, degraded share).
  - alert: CircuitBreakerOpen
    expr: max by (route) (ai_gateway_breaker_state) == 2
    for: 1m
    labels:
      severity: ticket
      slo: dependencies
    annotations:
      summary: A model route's circuit breaker has been open for a minute
      description: Requests are failing over to another route.
  - alert: DegradedTierServing
    expr: sum(rate(ai_gateway_requests_total{tier="degraded"}[5m])) > 0
    for: 1m
    labels:
      severity: page
      slo: no_degraded_tier
    annotations:
      summary: Answers are being produced by the degraded-tier model
      description: They are held or labelled, but a person must know.

# Generated by scripts/make_slo_rules.py from observability/slo.json. Do not edit by hand.
groups:
- name: slo-recording
  interval: 15s
  rules:
  - record: slo:error_ratio:ticket_availability:5m
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[5m]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[5m])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[5m]))) > 0.02)
  - record: slo:error_ratio:ticket_availability:30m
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[30m]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[30m])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[30m]))) > 0.02)
  - record: slo:error_ratio:ticket_availability:1h
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[1h]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[1h])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[1h]))) > 0.02)
  - record: slo:error_ratio:ticket_availability:6h
    expr: (1 - ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets",status_class!="5xx"}[6h]))) / (sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[6h])))))
      and on() ((sum(rate(http_server_requests_total{service_name="tickets",path="/tickets"}[6h]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:5m
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[5m]))) / (sum(rate(ai_ticket_outcomes_total[5m]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[5m]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:30m
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[30m]))) / (sum(rate(ai_ticket_outcomes_total[30m]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[30m]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:1h
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[1h]))) / (sum(rate(ai_ticket_outcomes_total[1h]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[1h]))) > 0.02)
  - record: slo:error_ratio:ticket_safe_completion:6h
    expr: (1 - ((sum(rate(ai_ticket_outcomes_total{action=~"released|escalated"}[6h]))) / (sum(rate(ai_ticket_outcomes_total[6h]))))) and on()
      ((sum(rate(ai_ticket_outcomes_total[6h]))) > 0.02)
  - record: slo:error_ratio:ticket_latency:5m
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[5m]))) / (sum(rate(ai_ticket_duration_seconds_count[5m]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[5m])))
      > 0.02)
  - record: slo:error_ratio:ticket_latency:30m
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[30m]))) / (sum(rate(ai_ticket_duration_seconds_count[30m]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[30m])))
      > 0.02)
  - record: slo:error_ratio:ticket_latency:1h
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[1h]))) / (sum(rate(ai_ticket_duration_seconds_count[1h]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[1h])))
      > 0.02)
  - record: slo:error_ratio:ticket_latency:6h
    expr: (1 - ((sum(rate(ai_ticket_duration_seconds_bucket{le="60"}[6h]))) / (sum(rate(ai_ticket_duration_seconds_count[6h]))))) and on() ((sum(rate(ai_ticket_duration_seconds_count[6h])))
      > 0.02)
  - record: slo:error_ratio:answer_quality_probe:5m
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[5m]))) / (sum(rate(ai_probe_results_total[5m]))))) and on() ((sum(rate(ai_probe_results_total[5m])))
      > 0.005)
  - record: slo:error_ratio:answer_quality_probe:30m
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[30m]))) / (sum(rate(ai_probe_results_total[30m]))))) and on() ((sum(rate(ai_probe_results_total[30m])))
      > 0.005)
  - record: slo:error_ratio:answer_quality_probe:1h
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[1h]))) / (sum(rate(ai_probe_results_total[1h]))))) and on() ((sum(rate(ai_probe_results_total[1h])))
      > 0.005)
  - record: slo:error_ratio:answer_quality_probe:6h
    expr: (1 - ((sum(rate(ai_probe_results_total{result="pass"}[6h]))) / (sum(rate(ai_probe_results_total[6h]))))) and on() ((sum(rate(ai_probe_results_total[6h])))
      > 0.005)
  - record: slo:error_ratio:no_degraded_tier:5m
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[5m]))) / (sum(rate(ai_gateway_requests_total[5m]))))) and on() ((sum(rate(ai_gateway_requests_total[5m])))
      > 0.02)
  - record: slo:error_ratio:no_degraded_tier:30m
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[30m]))) / (sum(rate(ai_gateway_requests_total[30m]))))) and on() ((sum(rate(ai_gateway_requests_total[30m])))
      > 0.02)
  - record: slo:error_ratio:no_degraded_tier:1h
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[1h]))) / (sum(rate(ai_gateway_requests_total[1h]))))) and on() ((sum(rate(ai_gateway_requests_total[1h])))
      > 0.02)
  - record: slo:error_ratio:no_degraded_tier:6h
    expr: (1 - ((sum(rate(ai_gateway_requests_total{tier!="degraded"}[6h]))) / (sum(rate(ai_gateway_requests_total[6h]))))) and on() ((sum(rate(ai_gateway_requests_total[6h])))
      > 0.02)
- name: slo-alerts
  interval: 15s
  rules:
  - alert: SLOBurn_ticket_availability_page
    expr: (slo:error_ratio:ticket_availability:1h / 0.01 > 14.4) and (slo:error_ratio:ticket_availability:5m / 0.01 > 14.4)
    for: 2m
    labels:
      severity: page
      slo: ticket_availability
    annotations:
      summary: ticket_availability is burning its error budget 14.4x too fast (1h and 5m)
      description: The ticket API answers without a server error. Objective 99.0%.
  - alert: SLOBurn_ticket_availability_ticket
    expr: (slo:error_ratio:ticket_availability:6h / 0.01 > 6) and (slo:error_ratio:ticket_availability:30m / 0.01 > 6)
    for: 15m
    labels:
      severity: ticket
      slo: ticket_availability
    annotations:
      summary: ticket_availability is burning its error budget 6x too fast (6h and 30m)
      description: The ticket API answers without a server error. Objective 99.0%.
  - alert: SLOBurn_ticket_safe_completion_page
    expr: (slo:error_ratio:ticket_safe_completion:1h / 0.1 > 14.4) and (slo:error_ratio:ticket_safe_completion:5m / 0.1 > 14.4)
    for: 2m
    labels:
      severity: page
      slo: ticket_safe_completion
    annotations:
      summary: ticket_safe_completion is burning its error budget 14.4x too fast (1h and 5m)
      description: A ticket is released or escalated on purpose, not held for a person and not lost to an error. Objective 90.0%.
  - alert: SLOBurn_ticket_safe_completion_ticket
    expr: (slo:error_ratio:ticket_safe_completion:6h / 0.1 > 6) and (slo:error_ratio:ticket_safe_completion:30m / 0.1 > 6)
    for: 15m
    labels:
      severity: ticket
      slo: ticket_safe_completion
    annotations:
      summary: ticket_safe_completion is burning its error budget 6x too fast (6h and 30m)
      description: A ticket is released or escalated on purpose, not held for a person and not lost to an error. Objective 90.0%.
  - alert: SLOBurn_ticket_latency_page
    expr: (slo:error_ratio:ticket_latency:1h / 0.05 > 14.4) and (slo:error_ratio:ticket_latency:5m / 0.05 > 14.4)
    for: 2m
    labels:
      severity: page
      slo: ticket_latency
    annotations:
      summary: ticket_latency is burning its error budget 14.4x too fast (1h and 5m)
      description: A ticket is finished within 60 seconds. Objective 95.0%.
  - alert: SLOBurn_ticket_latency_ticket
    expr: (slo:error_ratio:ticket_latency:6h / 0.05 > 6) and (slo:error_ratio:ticket_latency:30m / 0.05 > 6)
    for: 15m
    labels:
      severity: ticket
      slo: ticket_latency
    annotations:
      summary: ticket_latency is burning its error budget 6x too fast (6h and 30m)
      description: A ticket is finished within 60 seconds. Objective 95.0%.
  - alert: SLOBurn_answer_quality_probe_page
    expr: (slo:error_ratio:answer_quality_probe:1h / 0.05 > 14.4) and (slo:error_ratio:answer_quality_probe:5m / 0.05 > 14.4)
    for: 2m
    labels:
      severity: page
      slo: answer_quality_probe
    annotations:
      summary: answer_quality_probe is burning its error budget 14.4x too fast (1h and 5m)
      description: Probe questions with known right answers are answered correctly. Objective 95.0%.
  - alert: SLOBurn_answer_quality_probe_ticket
    expr: (slo:error_ratio:answer_quality_probe:6h / 0.05 > 6) and (slo:error_ratio:answer_quality_probe:30m / 0.05 > 6)
    for: 15m
    labels:
      severity: ticket
      slo: answer_quality_probe
    annotations:
      summary: answer_quality_probe is burning its error budget 6x too fast (6h and 30m)
      description: Probe questions with known right answers are answered correctly. Objective 95.0%.
  - alert: SLOBurn_no_degraded_tier_page
    expr: (slo:error_ratio:no_degraded_tier:1h / 0.01 > 14.4) and (slo:error_ratio:no_degraded_tier:5m / 0.01 > 14.4)
    for: 2m
    labels:
      severity: page
      slo: no_degraded_tier
    annotations:
      summary: no_degraded_tier is burning its error budget 14.4x too fast (1h and 5m)
      description: Model calls are answered by a normal-tier model, not the degraded fallback. Objective 99.0%.
  - alert: SLOBurn_no_degraded_tier_ticket
    expr: (slo:error_ratio:no_degraded_tier:6h / 0.01 > 6) and (slo:error_ratio:no_degraded_tier:30m / 0.01 > 6)
    for: 15m
    labels:
      severity: ticket
      slo: no_degraded_tier
    annotations:
      summary: no_degraded_tier is burning its error budget 6x too fast (6h and 30m)
      description: Model calls are answered by a normal-tier model, not the degraded fallback. Objective 99.0%.
  - alert: RestrictedFactLeaked
    expr: increase(ai_probe_leaks_total[15m]) > 0
    for: 0s
    labels:
      severity: page
      slo: access_control
    annotations:
      summary: A synthetic probe found a restricted fact in an answer
      description: Access control failed for at least one probe in the last 15 minutes. The objective is zero.
  - alert: DriftCritical
    expr: ai_drift_verdict == 2
    for: 1m
    labels:
      severity: page
      slo: drift
    annotations:
      summary: The drift monitor reads critical against the saved baseline
      description: See the monitor's /state for the findings (quality, leaks, degraded share).
  - alert: CircuitBreakerOpen
    expr: max by (route) (ai_gateway_breaker_state) == 2
    for: 1m
    labels:
      severity: ticket
      slo: dependencies
    annotations:
      summary: A model route's circuit breaker has been open for a minute
      description: Requests are failing over to another route.
  - alert: DegradedTierServing
    expr: sum(rate(ai_gateway_requests_total{tier="degraded"}[5m])) > 0
    for: 1m
    labels:
      severity: page
      slo: no_degraded_tier
    annotations:
      summary: Answers are being produced by the degraded-tier model
      description: They are held or labelled, but a person must know.

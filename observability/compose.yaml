# The observability stack, all open source (Apache-2.0 except Grafana, which is AGPL-3.0). It runs next to the
# services, which run on the host and send OTLP/HTTP to the collector on port 4318.
#
#   podman-compose -f observability/compose.yaml up -d
#   SLO_RULES=slo.lab.rules.yml podman-compose -f observability/compose.yaml up -d   # minute-scale windows for a short live run
#
#   collector  http://127.0.0.1:4318   (OTLP in; Prometheus scrape endpoint and Jaeger export out)
#   Jaeger     http://127.0.0.1:16686  (traces)
#   Prometheus http://127.0.0.1:9090   (metrics, SLO rules, alerts)
#   Alertmanager http://127.0.0.1:9093
#   alert sink http://127.0.0.1:9099/alerts   (what Alertmanager delivered)
#   Grafana    http://127.0.0.1:3000   (dashboard "AI system"; anonymous viewers, no login needed for a local lab)

name: observability

services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
    depends_on: [jaeger]

  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules/${SLO_RULES:-slo.rules.yml}:/etc/prometheus/rules/slo.yml:ro
    ports: ["9090:9090"]

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.1
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]

  alert-sink:
    image: docker.io/library/python:3.13-slim
    command: ["python", "/sink/alert_sink.py"]
    volumes: ["./sink:/sink:ro"]
    ports: ["9099:9099"]

  grafana:
    image: docker.io/grafana/grafana-oss:13.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: lab-only-change-me
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

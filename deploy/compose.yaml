# The four services as containers. Secrets are mounted as files (read through NAME_FILE), never passed as
# environment values; only the gateway is given the model provider's key. Traffic between services is TLS,
# signed by a private CA that every client trusts through SSL_CERT_FILE (ADK's A2A client requires https off loopback).
#
#   mkdir secrets && (create the five files listed under `secrets:` below, see deploy/README.md)
#   podman-compose -f deploy/compose.yaml up -d      (docker compose works the same)
#
# Built and run with Podman and podman-compose (both open source). tests/test_deploy_files.py also checks
# structurally that every service's configuration loads from exactly what is declared here.

x-service: &service
  # One image runs all four services (the command picks which). Build it once:
  #   python scripts/vendor_system.py
  #   podman build --format docker -f deploy/Dockerfile -t production-deployment-lab:phase1 --build-arg APP_VERSION=phase1 .
  image: localhost/production-deployment-lab:${APP_VERSION:-dev}
  restart: unless-stopped
  read_only: true
  user: "10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # DRAIN_SECONDS + GRACE_SECONDS, plus a margin: the orchestrator must not kill a service that is still draining.
  stop_grace_period: 75s
  tmpfs: [/tmp]

x-common-env: &common-env
  ENVIRONMENT: compose
  HOST: 0.0.0.0
  DRAIN_SECONDS: "5"
  GRACE_SECONDS: "60"
  LOG_LEVEL: INFO
  TLS_CERT_FILE: /run/secrets/tls_cert
  TLS_KEY_FILE: /run/secrets/tls_key
  SSL_CERT_FILE: /run/secrets/ca_pem        # clients trust only the lab CA

services:
  identity:
    <<: *service
    command: ["python", "-m", "services.identity_service"]
    environment:
      <<: *common-env
      PORT: "8101"
      TOKEN_SECRET_FILE: /run/secrets/token_secret
    secrets: [token_secret, tls_cert, tls_key, ca_pem]
    ports: ["8101:8101"]          # published only because this lab has no external identity provider to log in against
    healthcheck: &hc
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('https://localhost:8101/healthz',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  gateway:
    <<: *service
    command: ["python", "-m", "services.gateway_service"]
    environment:
      <<: *common-env
      PORT: "8102"
      GEMINI_API_KEY_FILE: /run/secrets/gemini_key
      GATEWAY_SERVICE_KEYS_FILE: /run/secrets/gateway_service_keys
      SSL_CERT_FILE: /run/secrets/ca_bundle     # public roots plus the lab CA: the gateway also calls the model provider
      REQUESTS_PER_MINUTE: "15"
      CACHE_SERVICES: knowledge-agent
      PIN_LIGHT: "true"            # stay on the light model so a free-tier daily quota on the heavy one is not spent
    secrets: [gemini_key, gateway_service_keys, tls_cert, tls_key, ca_bundle]
    healthcheck:
      <<: *hc
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('https://localhost:8102/healthz',timeout=2)"]

  knowledge:
    <<: *service
    command: ["python", "-m", "services.knowledge_service"]
    environment:
      <<: *common-env
      PORT: "8103"
      PUBLIC_URL: https://knowledge:8103
      GATEWAY_URL: https://gateway:8102
      TOKEN_SECRET_FILE: /run/secrets/token_secret
      GATEWAY_SERVICE_KEY_FILE: /run/secrets/gateway_key_knowledge
    secrets: [token_secret, gateway_key_knowledge, tls_cert, tls_key, ca_pem]
    healthcheck:
      <<: *hc
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('https://localhost:8103/healthz',timeout=2)"]

  tickets:
    <<: *service
    command: ["python", "-m", "services.ticket_service"]
    environment:
      <<: *common-env
      PORT: "8104"
      GATEWAY_URL: https://gateway:8102
      KNOWLEDGE_URL: https://knowledge:8103
      IDENTITY_URL: https://identity:8101
      TOKEN_SECRET_FILE: /run/secrets/token_secret
      GATEWAY_SERVICE_KEY_FILE: /run/secrets/gateway_key_ticket
    secrets: [token_secret, gateway_key_ticket, tls_cert, tls_key, ca_pem]
    ports: ["8104:8104"]
    healthcheck:
      <<: *hc
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('https://localhost:8104/healthz',timeout=2)"]

secrets:
  tls_cert: {file: ../secrets/tls_cert.pem}
  tls_key: {file: ../secrets/tls_key.pem}
  ca_pem: {file: ../secrets/ca.pem}
  ca_bundle: {file: ../secrets/ca_bundle.pem}
  token_secret: {file: ../secrets/token_secret}
  gemini_key: {file: ../secrets/gemini_key}
  gateway_service_keys: {file: ../secrets/gateway_service_keys}
  gateway_key_ticket: {file: ../secrets/gateway_key_ticket}
  gateway_key_knowledge: {file: ../secrets/gateway_key_knowledge}
